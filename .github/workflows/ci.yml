# CI pipeline for BEST-SYSTEM (delivery gates + e2e).
#
# The whole sequence runs via scripts/run-tests.sh:
#   install -> prisma -> build -> policy gates (check:policy, check:demo-creds)
#   -> e2e (Playwright against the booted Docker stack) -> restore drill.
# In CI, Playwright reuses the booted stack's app on 127.0.0.1:3000 (see
# playwright.config.js reuseExistingServer).
#
# GitHub Actions runners have Docker pre-installed, so docker compose works
# directly in this job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20.18.1

jobs:
  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      - name: Start Docker stack
        run: docker compose up -d --build
      - name: Wait for app health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "app healthy at http://127.0.0.1:3000/api/health"
              exit 0
            fi
            echo "waiting for app health... ($i)"
            sleep 5
          done
          echo "app did not become healthy"
          docker compose logs best_app | tail -30
          exit 1

      - name: Run delivery test suite
        run: bash ./scripts/run-tests.sh

      - name: Upload test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
