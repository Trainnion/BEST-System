# BEST-SYSTEM default stack (docs/implementation-plan.md Sec. 6.1).
# No `version:` key (obsolete in Compose v2).
# No default database password: POSTGRES_PASSWORD must come from .env (Sec. 16.2).
# best_postgres and best_app listen on 127.0.0.1 only; LAN devices reach BEST
# only through best_proxy over HTTPS (Sec. 7.8; E2E-01: no plain-HTTP listener).

services:
  best_postgres:
    image: postgres:16-alpine
    container_name: best_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: best_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (32+ random chars, generated by a person)}
      POSTGRES_DB: best_barangay_db
    ports:
      - "127.0.0.1:5432:5432"   # host-local only: LAN devices reach the app, never the database
    volumes:
      - best_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U best_admin -d best_barangay_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - best_network

  best_app:
    build:
      context: .
      args:
        BUILD_STANDALONE: "1"
    image: best_app:2026
    container_name: best_app
    restart: unless-stopped
    depends_on:
      best_postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://best_admin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@best_postgres:5432/best_barangay_db
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (32+ random chars)}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:?set QR_HMAC_SECRET in .env (32+ random chars)}
      FIELD_ENC_KEY: ${FIELD_ENC_KEY:?set FIELD_ENC_KEY in .env (32 random bytes, base64)}   # field-level encryption at rest
      BEST_ENV: ${BEST_ENV:-production}                 # production refuses demo data and demo credentials (Sec. 16.1)
      SESSION_IDLE_MS: ${SESSION_IDLE_MS:-900000}       # 15 minutes, enforced on the server (NFR-06)
      AI_MODE: ${AI_MODE:-local}                        # local = never touches the internet (default) | hybrid = optional Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}               # optional; ignored when AI_MODE=local; never for blotter or sealed fields
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      NEXT_PUBLIC_KIOSK: ${NEXT_PUBLIC_KIOSK:-false}    # kiosk mode flag (Sec. 1.2); disabled offline persistence in kiosk
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"   # only best_proxy (HTTPS) is reachable from the LAN
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - best_network

  best_proxy:                    # REQUIRED HTTPS for every device (Sec. 7.8, Sec. 12.2)
    image: caddy:2-alpine
    container_name: best_proxy
    restart: unless-stopped
    depends_on:
      - best_app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro        # only used by the commented production tls lines in the Caddyfile
      - best_caddy_data:/data
    environment:
      BEST_HOST: ${BEST_HOST:?set BEST_HOST in .env}
    networks:
      - best_network

networks:
  best_network:
    driver: bridge

volumes:
  best_pgdata:
    name: best_pgdata
  best_caddy_data:
    name: best_caddy_data
